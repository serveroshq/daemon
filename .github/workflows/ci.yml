name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # The daemon runs as root on real machines; exercise the Linux-only
  # paths (procfs, PTY, systemd) as root too.
  root-tests:
    name: tests as root
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --no-run
      - run: sudo -E env "PATH=$PATH" cargo test --workspace -- --include-ignored

  musl:
    name: static build (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      # aarch64 builds with zig as the C compiler and linker, so bundled C
      # (SQLite) compiles against musl's headers rather than glibc's.
      - if: matrix.target == 'aarch64-unknown-linux-musl'
        uses: mlugg/setup-zig@v2
      - if: matrix.target == 'aarch64-unknown-linux-musl'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - run: cargo ${{ matrix.target == 'aarch64-unknown-linux-musl' && 'zigbuild' || 'build' }} --release --target ${{ matrix.target }} -p serverosd
      - run: file target/${{ matrix.target }}/release/serverosd | grep -qE 'statically linked|static-pie linked'
