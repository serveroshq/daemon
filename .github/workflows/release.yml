# Tag `vX.Y.Z` → static binaries for amd64 and arm64, signed with the
# release key, checksummed, and published with a manifest per arch, then
# uploaded to the panel and registered there, so machines update on their own.
# Tags go to the stable channel, prereleases (-pre.N) included; only tags
# with "canary" in them (v0.2.0-canary.1) go to canary.
#
# Secrets: SERVEROS_RELEASE_KEY (hex private key from `serveros-release keygen`),
#          SERVEROS_DEPLOY_TOKEN (the panel's SERVEROS_DEPLOY_TOKEN, to register releases).
#          SERVEROS_SENTRY_DSN (repository secret, not the release environment's:
#          the build job bakes it in for error reports; unset means none).
# Variables: SERVEROS_RELEASE_PUBKEY (the matching public key, baked into the binary),
#            SERVEROS_PANEL_URL (e.g. https://serveros.com; skipped when unset).

name: Release

on:
  push:
    tags: ["v*"]

# Only the publish job gets to write, and only it sees the signing key and
# deploy token. The build job sees just the Sentry DSN, which ships inside
# the binary anyway.
permissions:
  contents: read

# No build cache here on purpose: a release must never reuse a cache that a
# less trusted run could have written into the signed binary.

jobs:
  build:
    name: build (${{ matrix.arch }})
    # Forks have no secrets and nowhere to publish.
    if: github.repository == 'serveroshq/daemon'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
          - arch: arm64
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      # aarch64 builds with zig as the C compiler and linker, so bundled C
      # (SQLite) compiles against musl's headers rather than glibc's.
      - if: matrix.target == 'aarch64-unknown-linux-musl'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          use-cache: false
      - if: matrix.target == 'aarch64-unknown-linux-musl'
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-zigbuild
      - name: Build
        run: cargo "$CARGO_COMMAND" --release --target "$TARGET" -p serverosd
        env:
          CARGO_COMMAND: ${{ matrix.target == 'aarch64-unknown-linux-musl' && 'zigbuild' || 'build' }}
          TARGET: ${{ matrix.target }}
          SERVEROS_VERSION: ${{ github.ref_name }}
          SERVEROS_COMMIT: ${{ github.sha }}
          SERVEROS_CHANNEL: ${{ contains(github.ref_name, 'canary') && 'canary' || 'stable' }}
          SERVEROS_TARGET: linux-${{ matrix.arch }}
          SERVEROS_RELEASE_PUBKEY: ${{ vars.SERVEROS_RELEASE_PUBKEY }}
          SERVEROS_SENTRY_DSN: ${{ secrets.SERVEROS_SENTRY_DSN }}
      - name: Stage
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          cp "target/$TARGET/release/serverosd" "dist/serverosd-$TAG-linux-$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: serverosd-${{ matrix.arch }}
          path: dist/*

  sign-and-publish:
    needs: build
    if: github.repository == 'serveroshq/daemon'
    runs-on: ubuntu-24.04
    # Holds the release key and deploy token; once the repo is public it
    # waits for a maintainer's approval and only takes v* tags
    # (scripts/protect-github.sh sets that up).
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Sign and write manifests
        env:
          RELEASE_KEY: ${{ secrets.SERVEROS_RELEASE_KEY }}
          TAG: ${{ github.ref_name }}
          CHANNEL: ${{ contains(github.ref_name, 'canary') && 'canary' || 'stable' }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          cargo build --release -p serveros-release
          printf '%s' "$RELEASE_KEY" > release.key
          chmod 600 release.key
          cd dist
          sha256sum serverosd-* > SHA256SUMS
          for arch in amd64 arm64; do
            f="serverosd-$TAG-linux-$arch"
            ../target/release/serveros-release manifest \
              --version "$TAG" \
              --channel "$CHANNEL" \
              --url "https://releases.serveros.com/$TAG/$f" \
              --file "$f" --key ../release.key \
              --notes-url "https://github.com/$REPOSITORY/releases/tag/$TAG" \
              > "manifest-$arch.json"
          done
          rm -f ../release.key
      - name: Publish
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
      # The panel serves the binaries daemons download, and refuses to
      # register a release until its binary is there.
      - name: Upload to the panel and register
        if: vars.SERVEROS_PANEL_URL != ''
        env:
          PANEL_URL: ${{ vars.SERVEROS_PANEL_URL }}
          DEPLOY_TOKEN: ${{ secrets.SERVEROS_DEPLOY_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for f in dist/serverosd-* dist/SHA256SUMS; do
            curl -fsS -X PUT "$PANEL_URL/api/daemon/releases/$TAG/$(basename "$f")" \
              -H "Authorization: Bearer $DEPLOY_TOKEN" \
              -H "Content-Type: application/octet-stream" -H "Accept: application/json" \
              --data-binary @"$f"
            echo
          done
          for arch in amd64 arm64; do
            jq --arg arch "$arch" '. + {arch: $arch}' "dist/manifest-$arch.json" \
              | curl -fsS -X POST "$PANEL_URL/api/daemon/releases" \
                  -H "Authorization: Bearer $DEPLOY_TOKEN" \
                  -H "Content-Type: application/json" -H "Accept: application/json" \
                  --data-binary @-
            echo
          done
